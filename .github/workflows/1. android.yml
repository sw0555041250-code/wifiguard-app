name: Build Android APK

on:
  push:
    branches: [ "sw0555041250-קוד" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Find and Build APK
      run: |
        # 1. מציאת התיקייה בה נמצא קובץ ה-gradlew
        GRADLEW_PATH=$(find . -name gradlew -print -quit)
        GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found gradlew in directory: $GRADLEW_DIR"
        
        # 2. מתן הרשאות ביצוע לקובץ
        chmod +x "$GRADLEW_PATH"
        
        # 3. כניסה לתיקייה והרצת הבנייה של ה-APK
        cd "$GRADLEW_DIR"
        ./gradlew assembleDebug

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: wifiguard-debug-apk
        path: "**/build/outputs/apk/debug/app-debug.apk"
