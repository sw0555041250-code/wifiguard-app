name: Build Android APK

on:
  push:
    branches: [ "sw0555041250-קוד" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Find and Grant execute permission for gradlew
      run: |
        GRADLEW_PATH=$(find . -name gradlew -print -quit)
        echo "Found gradlew at: $GRADLEW_PATH"
        chmod +x "$GRADLEW_PATH"
        echo "GRADLEW_DIR=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV

    - name: Build with Gradle
      run: ./gradlew assembleDebug
      working-directory: ${{ env.GRADLEW_DIR }}

    - name: Upload APK
      run: |
        APK_PATH=$(find . -name "app-debug.apk" -print -quit)
        echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: wifiguard-debug-apk
        path: ${{ env.APK_PATH }}
