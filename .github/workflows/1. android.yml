name: Build Android APK

on:
  push:
    branches: [ "sw0555041250-קוד" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x wifiguard_project/wifiguard/gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug
      working-directory: wifiguard_project/wifiguard

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: wifiguard-debug-apk
        path: wifiguard_project/wifiguard/app/build/outputs/apk/debug/app-debug.apk
